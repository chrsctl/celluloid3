name: ci

# `main` is built on push, branches by their pull request — the split gx
# measured (25 of 65 SHAs built twice under `on: [push, pull_request]`) applies
# here unchanged.
on:
  push:
    branches: [main]
  pull_request:

# Main pushes get a per-sha group: GitHub keeps at most one running plus one
# PENDING run per group, and each newly arriving run evicts the pending one
# regardless of cancel-in-progress — which dropped two of the three main
# runs when merges landed 15s apart (2026-08-23), exactly the runs that
# catch cross-PR collisions no per-PR gate can see. Distinct groups mean
# nothing shares a queue slot: every merge commit keeps its own verdict,
# in parallel. Branch/PR runs keep the shared per-ref group and cancel
# superseded runs as before.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The harness is shell; shellcheck at zero findings is its acceptance bar
  # (AGENTS.md). Every layer is covered: the entrypoint, .agents/harness/,
  # and each .agents/env/<name>/ whether or not this repo selects it. The
  # runner image ships
  # shellcheck, so this is seconds.
  #
  # The checks live in `joharness.sh ci`, not in this file, so a session can run
  # exactly what CI runs before opening the pull request instead of finding out
  # afterwards.
  #
  # The environment smoke test is deliberately NOT here: it needs the sandbox
  # this repo provisions (Docker-in-Docker, the egress proxy, the cgroup v1
  # kernel), and a GitHub runner exercises none of the constraints the scripts
  # exist to work around. A green run here would claim more than it checked.
  # `./joharness.sh verify` is where that gets proven.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth 1: the graph lint resolves
      # names against HEAD's history to tell a typo from a merged-and-
      # deleted plan. On a shallow checkout it degrades those reds to
      # warnings (it cannot prove a typo there), so depth 1 here would
      # run a weaker gate than a local `./joharness.sh ci`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: joharness ci
        run: ./joharness.sh ci

  # `joharness ci` above judges the harness, which is shell. It says nothing
  # about celluloid3 itself, so a repo that stopped there would ship a green
  # tick for a red test suite.
  #
  # The native kernel is built and installed rather than left out: it is
  # optional by contract, so `tests/test_native_core.py` skips itself when
  # `celluloid3_core` is missing -- and a parity test that skips looks exactly
  # like a parity test that passes. The import check between the two steps is
  # what stops that reading. `maturin build` + `pip install` rather than
  # `maturin develop`, which wants a virtualenv the runner does not have.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build and install the native kernel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m rust/Cargo.toml -o wheels
          python -m pip install wheels/*.whl
      - name: install the package with its dev extra
        run: python -m pip install -e '.[dev]'
      - name: the kernel imports, so the parity tests run instead of skipping
        run: python -c "import celluloid3_core"
      - name: pytest
        run: pytest -q

  # Windows is where the harness breaks silently. Two defects in two days were
  # invisible from macOS and Linux and fatal on a stock Git for Windows clone:
  # core.autocrlf=true turning every script CRLF until .gitattributes pinned
  # them, and `git rev-parse --show-toplevel` answering in Windows form while
  # `pwd -P` answers in MSYS form, which made sync-to-consumer.sh refuse every
  # checkout as nested inside itself.
  #
  # Different question from the job above, so a separate check rather than a
  # matrix: that one asks "does the code pass its acceptance bar", this one
  # asks "does it run on Git Bash". shellcheck is deliberately not repeated
  # here - the toolchain answer does not change per platform, and installing
  # it on a Windows runner is a path to maintain for nothing.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: harness selftest on Git Bash
        run: ./.agents/harness/selftest.sh
