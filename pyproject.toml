[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celloid3"
version = "0.2.0"
description = "Shared memory layer for AI agents on object storage, with TurboQuant-compressed embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
s3 = ["boto3>=1.35.0"]
dev = ["pytest>=8"]

[project.scripts]
celloid3 = "celloid3.__main__:main"

[tool.setuptools]
packages = ["celloid3"]
